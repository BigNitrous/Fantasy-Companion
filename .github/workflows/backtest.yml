name: Backtest data (one-off)

# Lives only on the `backtest` branch. Pushing that branch saves ESPN's past
# projections and results to backtest/data/ on the same branch. Never touches
# main or the dashboard.
on:
  push:
    branches: [backtest]
    paths: ["backtest/fetch_espn.py", "backtest/fetch_sources.py", ".github/workflows/backtest.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "espn-api>=0.44.0" "requests>=2.31.0"
      - name: Save ESPN weeks
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SEASON: "2026"
        run: |
          python backtest/fetch_espn.py
          python backtest/fetch_sources.py
      - name: Commit the data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/data
          git commit -m "Backtest data from ESPN [skip ci]" || echo "nothing new"
          git push origin HEAD:backtest
